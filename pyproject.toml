[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "I",   # isort
]
ignore = [
    "E501", # line too long
    "E402", # module level import not at top of file (needed for local .pylib fallback)
]
